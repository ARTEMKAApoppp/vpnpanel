<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель</title>
<style>
:root{--bg:#090c11;--c1:#111720;--c2:#182130;--ln:#ffffff14;--tx:#e9eef6;--mu:#8190a6;--a:#b8ff3d;--b:#35e0c2;--bad:#ff5d6c;--warn:#ffb84d;--r:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#35e0c21f,transparent),radial-gradient(700px 500px at -10% 110%,#b8ff3d14,transparent),var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{padding:20px 14px;border-right:1px solid var(--ln);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:20px;padding:6px 12px 18px;letter-spacing:-.5px}.logo i{color:var(--a);font-style:normal}
nav button.t{background:0;border:0;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mu);cursor:pointer;display:flex;gap:10px;align-items:center}
nav button.t.on{background:var(--c2);color:var(--tx);box-shadow:inset 3px 0 var(--a)}nav button.t:hover{color:var(--tx)}
.sp{flex:1}main{padding:28px 32px;max-width:1200px;width:100%}
h1{margin:0;font-size:28px;letter-spacing:-.8px}.sub{color:var(--mu);margin:2px 0 22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(160deg,var(--c2),var(--c1));border:1px solid var(--ln);border-radius:var(--r);padding:18px}
.k{color:var(--mu);font-size:13px}.v{font-size:32px;font-weight:800;letter-spacing:-1px;margin:4px 0}.v small{font-size:15px;color:var(--mu);font-weight:600}
.btn{border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;background:var(--c2);border:1px solid var(--ln)}
.btn.p{background:linear-gradient(90deg,var(--a),var(--b));color:#06100a;border:0}.btn.d{color:var(--bad)}.btn:hover{filter:brightness(1.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--c1);cursor:pointer;color:var(--mu)}.chip.on{background:var(--a);color:#06100a;border-color:0;font-weight:700}
input,select{background:#0006;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;outline:0}input:focus,select:focus{border-color:var(--b)}
label{display:block;color:var(--mu);font-size:12px;margin:12px 0 5px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{color:var(--mu);font-weight:500;text-align:left;font-size:12px;padding:10px 12px}td{padding:12px;border-top:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover{background:#ffffff08}
.bar{height:6px;border-radius:9px;background:#ffffff14;overflow:hidden;margin-top:6px;min-width:110px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}.bar.w i{background:var(--bad)}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.tag.ok{background:#b8ff3d22;color:var(--a)}.tag.bad{background:#ff5d6c22;color:var(--bad)}.tag.mut{background:#ffffff14;color:var(--mu)}
.ov{position:fixed;inset:0;background:#000a;backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:9;overflow:auto}
.md{background:var(--c1);border:1px solid var(--ln);border-radius:22px;padding:24px;width:100%;max-width:460px;max-height:94vh;overflow:auto}.md h3{margin:0 0 6px;font-size:20px}
.row{display:flex;gap:10px}.row>*{flex:1}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
code{display:block;word-break:break-all;background:#0006;padding:10px;border-radius:10px;font-size:12px;color:var(--b);margin-top:8px}
.qr{display:grid;place-items:center;margin:14px 0}.qr div{background:#fff;padding:10px;border-radius:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--c2);border:1px solid var(--ln);padding:12px 20px;border-radius:14px;z-index:20}
.lg{min-height:100vh;display:grid;place-items:center;padding:16px}.lg .md{max-width:360px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;z-index:5;background:var(--c1);padding:6px;border:0;border-top:1px solid var(--ln)}.logo,.sp{display:none}nav button.t{flex:1;justify-content:center;font-size:12px;padding:10px 4px}nav button.t.on{box-shadow:none}main{padding:18px 14px 90px}.g2{grid-template-columns:1fr}}
</style>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),GB=1024**3;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fb=b=>b>=GB?(b/GB).toFixed(2)+' ГБ':(b/1048576).toFixed(0)+' МБ';
const ST={active:['активен','ok'],expired:['истёк','bad'],limited:['лимит','bad'],disabled:['выключен','mut']};
let S=null,tab='home',flt='all',q='';
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)};
async function api(u,m='GET',b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401&&u!=='/api/login'){login();throw 0}const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Ошибка');throw j}return j}
function login(){S=null;$('#root').innerHTML=`<div class="lg"><div class="md"><h3>Вход в панель</h3><label>Логин</label><input id="lu" autocomplete="username"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password" onkeydown="event.key=='Enter'&&doLogin()"><div class="acts"><button class="btn p" style="width:100%" onclick="doLogin()">Войти</button></div></div></div>`}
async function doLogin(){try{await api('/api/login','POST',{username:$('#lu').value,password:$('#lp').value});load()}catch(e){}}
async function load(){try{S=await api('/api/state');render()}catch(e){}}
const days=u=>u.expire?Math.ceil((u.expire-Date.now())/864e5):null;
function render(){
  const T=[['home','◎','Обзор'],['users','☺','Клиенты'],['plans','◈','Тарифы'],['set','⚙','Настройки']];
  $('#root').innerHTML=`<div class="app"><nav><div class="logo">${esc(S.settings.title)}<i>.</i></div>${T.map(t=>`<button class="t ${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('')}<div class="sp"></div><button class="t" onclick="api('/api/logout').then(login)">⎋ Выйти</button></nav><main>${{home,users,plans,set}[tab]()}</main></div>`}
function home(){
  const U=S.users,act=U.filter(u=>u.status=='active'),tot=U.reduce((a,u)=>a+u.used,0);
  const soon=U.filter(u=>u.enabled&&u.expire&&u.expire>Date.now()&&u.expire-Date.now()<7*864e5);
  const bad=U.filter(u=>u.status=='expired'||u.status=='limited'),m=S.sys.memUsed/S.sys.memTotal*100,c=Math.min(100,S.sys.load/S.sys.cpus*100);
  const bar=(n,p)=>`<div style="margin-top:14px"><div class="k" style="display:flex;justify-content:space-between"><span>${n}</span><b>${p.toFixed(0)}%</b></div><div class="bar ${p>85?'w':''}"><i style="width:${p}%"></i></div></div>`;
  return `<div class="top"><div><h1>Обзор</h1><div class="sub">${S.sys.xray?'Xray работает штатно':'⚠ Xray остановлен'}</div></div><button class="btn p" onclick="newUser()">＋ Новый клиент</button></div>
  <div class="grid g4"><div class="card"><div class="k">Активные подписки</div><div class="v">${act.length}<small> из ${U.length}</small></div></div>
  <div class="card"><div class="k">Весь трафик</div><div class="v">${fb(tot)}</div></div>
  <div class="card"><div class="k">Истекают за 7 дней</div><div class="v">${soon.length}</div></div>
  <div class="card"><div class="k">Требуют внимания</div><div class="v">${bad.length}</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><b>Сервер</b>${bar('CPU',c)}${bar('Память',m)}<div class="k" style="margin-top:14px">Аптайм: ${Math.floor(S.sys.uptime/86400)} д ${Math.floor(S.sys.uptime%86400/3600)} ч</div></div>
  <div class="card"><b>Скоро истекают / исчерпаны</b>${[...soon,...bad].slice(0,6).map(u=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer" onclick="openUser('${u.id}')"><span>${esc(u.name)}</span><span class="tag ${ST[u.status][1]}">${u.status=='active'?days(u)+' дн.':ST[u.status][0]}</span></div>`).join('')||'<p class="k">Всё в порядке ✨</p>'}</div></div>`}
function users(){
  const F={all:'Все',active:'Активные',soon:'Истекают',expired:'Истекли',limited:'Лимит',disabled:'Выключены'};
  const ok=u=>flt=='all'||(flt=='soon'?u.enabled&&u.expire&&u.expire>Date.now()&&u.expire-Date.now()<7*864e5:u.status==flt);
  const L=S.users.filter(u=>ok(u)&&(u.name+u.note+(u.plan||'')).toLowerCase().includes(q.toLowerCase()));
  return `<div class="top"><div><h1>Клиенты</h1><div class="sub">${S.users.length} всего · ${S.users.filter(u=>u.status=='active').length} активных</div></div><button class="btn p" onclick="newUser()">＋ Новый клиент</button></div>
  <div class="chips">${Object.entries(F).map(([k,v])=>`<span class="chip ${flt==k?'on':''}" onclick="flt='${k}';render()">${v}</span>`).join('')}</div>
  <input placeholder="Поиск по имени, тарифу, заметке" value="${esc(q)}" oninput="q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const i=document.querySelector('main input');i.focus();i.setSelectionRange(99,99)},250)" style="margin-bottom:14px">
  <div class="card tw" style="padding:6px"><table><tr><th>Клиент</th><th>Тариф</th><th>Трафик</th><th>Срок</th><th>Статус</th></tr>${L.map(u=>{const p=u.limit?Math.min(100,u.used/u.limit*100):0;return `<tr class="r" onclick="openUser('${u.id}')"><td><b>${esc(u.name)}</b><div class="k">${esc(u.note)}</div></td><td>${esc(u.plan||'—')}</td><td>${fb(u.used)}${u.limit?' / '+fb(u.limit):' · ∞'}<div class="bar ${p>90?'w':''}"><i style="width:${u.limit?p:100}%;${u.limit?'':'opacity:.35'}"></i></div></td><td>${u.expire?new Date(u.expire).toLocaleDateString('ru-RU')+'<div class="k">'+days(u)+' дн.</div>':'бессрочно'}</td><td><span class="tag ${ST[u.status][1]}">${ST[u.status][0]}</span></td></tr>`}).join('')||'<tr><td colspan=5 class="k">Никого не найдено</td></tr>'}</table></div>`}
function plans(){return `<div class="top"><div><h1>Тарифы</h1><div class="sub">Шаблоны выдачи доступа в один клик. Изменение тарифа не трогает выданные подписки.</div></div><button class="btn p" onclick="planModal()">＋ Новый тариф</button></div>
  <div class="grid g3">${S.plans.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between"><b style="font-size:18px">${esc(p.name)}</b><b style="color:var(--a)">${p.price?p.price+' ₽':'бесплатно'}</b></div>
  <div class="k" style="margin-top:12px">Срок</div><b>${p.days?p.days+' дн.':'бессрочно'}</b><div class="k" style="margin-top:8px">Трафик</div><b>${p.limitGb?p.limitGb+' ГБ':'без лимита'}</b>
  <div class="acts"><button class="btn" onclick="planModal('${p.id}')">Изменить</button><button class="btn d" onclick="delPlan('${p.id}')">Удалить</button></div></div>`).join('')||'<p class="k">Тарифов пока нет</p>'}</div>`}
function set(){const s=S.settings,f=(id,l,v,h='')=>`<label>${l}</label><input id="${id}" value="${esc(v)}">${h?`<div class="k" style="margin-top:4px">${h}</div>`:''}`;
  return `<h1>Настройки</h1><div class="sub">Адрес сервера, оформление подписки и Reality</div><div class="card" style="max-width:560px">${f('s_title','Название сервиса',s.title,'Так профиль называется в приложениях клиентов')}${f('s_host','Адрес сервера (IP или домен)',s.host)}<div class="row"><div>${f('s_port','Порт VPN',s.port)}</div><div>${f('s_sni','SNI (маскировка)',s.sni)}</div></div>${f('s_sub','Публичный URL панели',s.subBase,'Для ссылок подписки, например https://домен:8443')}${f('s_sup','Поддержка',s.support||'','Ссылка на Telegram или сайт')}
  <div class="acts"><button class="btn p" onclick="saveSet()">Сохранить</button></div></div>`}
async function saveSet(){await api('/api/settings','PUT',{title:$('#s_title').value,host:$('#s_host').value,port:$('#s_port').value,sni:$('#s_sni').value,subBase:$('#s_sub').value,support:$('#s_sup').value});toast('Сохранено ✓');load()}
function modal(h){const o=document.createElement('div');o.className='ov';o.onclick=e=>e.target==o&&o.remove();o.innerHTML=`<div class="md">${h}</div>`;document.body.append(o);return o}
const closeM=()=>document.querySelector('.ov')?.remove();
function newUser(){modal(`<h3>Новый клиент</h3><label>Имя</label><input id="n_name" autofocus><label>Тариф</label><select id="n_plan"><option value="">Свои параметры</option>${S.plans.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
  <div class="row"><div><label>Дней (0 = бессрочно)</label><input id="n_days" type="number" value="30"></div><div><label>Лимит ГБ (0 = ∞)</label><input id="n_lim" type="number" value="0"></div></div><label>Заметка</label><input id="n_note">
  <div class="acts"><button class="btn p" onclick="addUser()">Создать</button><button class="btn" onclick="closeM()">Отмена</button></div>`)}
async function addUser(){const u=await api('/api/users','POST',{name:$('#n_name').value,planId:$('#n_plan').value,days:$('#n_days').value,limitGb:$('#n_lim').value,note:$('#n_note').value});closeM();await load();openUser(u.id)}
let qrL;const loadQR=()=>qrL||(qrL=new Promise(r=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=r;s.onerror=r;document.head.append(s)}));
async function openUser(id){const u=S.users.find(x=>x.id==id);if(!u)return;const url=S.origin+'/sub/'+u.token;closeM();
  modal(`<h3>${esc(u.name)} <span class="tag ${ST[u.status][1]}">${ST[u.status][0]}</span></h3><div class="k">Использовано ${fb(u.used)} · ↑${fb(u.up)} ↓${fb(u.down)}</div><div class="qr"><div id="qrb"></div></div><code>${esc(url)}</code>
  <div class="acts"><button class="btn p" onclick="navigator.clipboard.writeText('${url}');toast('Ссылка скопирована ✓')">Скопировать ссылку</button><button class="btn" onclick="window.open('${url}?raw=1')">Открыть</button></div>
  <label>Имя</label><input id="e_name" value="${esc(u.name)}"><div class="row"><div><label>Лимит ГБ (0 = ∞)</label><input id="e_lim" type="number" value="${(u.limit/GB).toFixed(2).replace(/\.?0+$/,'')||0}"></div><div><label>Продлить: дней от сегодня</label><input id="e_days" type="number" placeholder="не менять"></div></div><label>Заметка</label><input id="e_note" value="${esc(u.note)}">
  <div class="acts"><button class="btn p" onclick="saveUser('${id}')">Сохранить</button><button class="btn" onclick="patch('${id}',{enabled:${!u.enabled}})">${u.enabled?'Выключить':'Включить'}</button><button class="btn" onclick="patch('${id}',{resetTraffic:true})">Сбросить трафик</button><button class="btn d" onclick="delUser('${id}')">Удалить</button></div>`);
  await loadQR();try{new QRCode($('#qrb'),{text:url,width:170,height:170})}catch(e){}}
async function patch(id,b){await api('/api/users/'+id,'PATCH',b);await load();openUser(id)}
function saveUser(id){const b={name:$('#e_name').value,note:$('#e_note').value,limitGb:$('#e_lim').value||0};if($('#e_days').value!=='')b.days=$('#e_days').value;patch(id,b);toast('Сохранено ✓')}
async function delUser(id){if(!confirm('Удалить клиента?'))return;await api('/api/users/'+id,'DELETE');closeM();load()}
function planModal(id){const p=S.plans.find(x=>x.id==id)||{name:'',price:0,days:30,limitGb:0};modal(`<h3>${id?'Изменить':'Новый'} тариф</h3><label>Название</label><input id="p_name" value="${esc(p.name)}"><div class="row"><div><label>Цена, ₽</label><input id="p_price" type="number" value="${p.price}"></div><div><label>Срок, дней (0 = ∞)</label><input id="p_days" type="number" value="${p.days}"></div></div><label>Лимит трафика, ГБ (0 = ∞)</label><input id="p_lim" type="number" value="${p.limitGb}">
  <div class="acts"><button class="btn p" onclick="savePlan('${id||''}')">Сохранить</button><button class="btn" onclick="closeM()">Отмена</button></div>`)}
async function savePlan(id){const b={name:$('#p_name').value,price:$('#p_price').value,days:$('#p_days').value,limitGb:$('#p_lim').value};await api(id?'/api/plans/'+id:'/api/plans',id?'PUT':'POST',b);closeM();load()}
async function delPlan(id){if(!confirm('Удалить тариф?'))return;await api('/api/plans/'+id,'DELETE');load()}
load();setInterval(()=>S&&!document.querySelector('.ov')&&document.activeElement.tagName!='INPUT'&&load(),20000);
</script>
