<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Panel</title>
<style>
:root{--bg:#07070f;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#eef0ff;--mut:#8b90b0;--a:#7c6cff;--b:#18c7ff;--ok:#2ee59d;--warn:#ffb84d;--bad:#ff5d7a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;animation:fl 18s ease-in-out infinite alternate;pointer-events:none}
.b1{width:520px;height:520px;background:#5b3df5;top:-160px;left:-120px}
.b2{width:460px;height:460px;background:#0ab7ff;bottom:-160px;right:-100px;animation-delay:-6s}
.b3{width:340px;height:340px;background:#ff3d8b;top:40%;left:55%;opacity:.22;animation-delay:-11s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.glass{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px}
button,input{font:inherit;color:inherit}
.btn{border:0;cursor:pointer;padding:11px 18px;border-radius:14px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font-weight:650;font-size:14px;transition:.2s;box-shadow:0 8px 28px #7c6cff40}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px #18c7ff50}
.btn.g{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--bd)}
.btn.g:hover{background:rgba(255,255,255,.14)}
.btn.s{padding:8px 11px;font-size:13px;border-radius:11px}
.btn.d{background:rgba(255,93,122,.15);color:var(--bad);border:1px solid rgba(255,93,122,.3);box-shadow:none}
input{width:100%;padding:13px 15px;border-radius:13px;background:rgba(0,0,0,.35);border:1px solid var(--bd);outline:none;transition:.2s;font-size:14px}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px #7c6cff33}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 6px}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;position:relative;z-index:1;padding:16px}
.lg{width:100%;max-width:400px;padding:36px 30px;text-align:center}
.logo{width:68px;height:68px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 40px #7c6cff77}
.lg h1{font-size:25px;margin-bottom:6px}.lg p{color:var(--mut);font-size:14px;margin-bottom:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
/* header */
header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
header .logo{width:46px;height:46px;font-size:22px;margin:0;border-radius:15px}
header h2{font-size:21px}header small{color:var(--mut)}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.st{padding:18px 20px}.st .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.st .v{font-size:27px;font-weight:750;margin-top:6px}.st .h{font-size:12px;color:var(--mut);margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--bad);box-shadow:0 0 10px currentColor;color:var(--bad)}
.dot.on{background:var(--ok);color:var(--ok)}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b))}
.tool{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}.tool input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.u{padding:20px;transition:.25s;animation:in .4s both}
.u:hover{transform:translateY(-4px);border-color:rgba(124,108,255,.5);box-shadow:0 18px 50px #7c6cff25}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.u .top{display:flex;align-items:center;gap:12px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.u .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u .nt{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{margin-left:auto;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;flex:none}
.active{background:rgba(46,229,157,.15);color:var(--ok)}.disabled{background:rgba(139,144,176,.2);color:var(--mut)}
.expired,.limited{background:rgba(255,93,122,.15);color:var(--bad)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:16px}
.meta b{color:var(--tx)}
.act{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}.act .btn{flex:1;min-width:0;white-space:nowrap}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,3,10,.7);backdrop-filter:blur(6px);z-index:10;display:grid;place-items:center;padding:16px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.md{width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:26px;background:#12122a;animation:in .3s}
.md h3{font-size:19px;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qr{display:grid;place-items:center;margin:16px 0}.qr div{background:#fff;padding:12px;border-radius:16px}
.code{word-break:break-all;font-size:12px;background:rgba(0,0,0,.4);padding:11px;border-radius:12px;color:#9cf;margin-top:8px;cursor:pointer;border:1px dashed var(--bd)}
.mf{display:flex;gap:10px;margin-top:20px}.mf .btn{flex:1}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{background:#1d1d3d;border:1px solid var(--bd);padding:11px 18px;border-radius:13px;font-size:14px;animation:in .25s;box-shadow:0 10px 40px #0008}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="login" class="hidden">
  <form class="glass lg" onsubmit="return doLogin(event)">
    <div class="logo">🛡</div>
    <h1>VPN Panel</h1><p>Войдите в панель управления</p>
    <label style="text-align:left">Логин</label><input id="lu" autocomplete="username" required>
    <label style="text-align:left">Пароль</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="le"></div>
    <button class="btn" style="width:100%;margin-top:6px;padding:14px">Войти</button>
  </form>
</div>

<div id="app" class="wrap hidden">
  <header>
    <div class="logo">🛡</div>
    <div><h2 id="ttl">VPN Panel</h2><small>VLESS · Reality · Xray</small></div>
    <div class="sp"></div>
    <button class="btn g" onclick="openSettings()">⚙ Настройки</button>
    <button class="btn g" onclick="logout()">Выйти</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tool">
    <input id="q" placeholder="🔍 Поиск пользователей…" oninput="render()">
    <button class="btn" onclick="openUser()">＋ Новый пользователь</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<div id="toast"></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const GB=1024**3;
let S=null,timer=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=document.createElement('div');e.className='tt';e.textContent=t;$('#toast').appendChild(e);setTimeout(()=>e.remove(),2600)}
async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  if(r.status===401&&u!=='/api/login'){showLogin();throw new Error('auth')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Ошибка');
  return j;
}
function fmt(b){if(b<1024**2)return (b/1024).toFixed(0)+' KB';if(b<GB)return (b/1024**2).toFixed(1)+' MB';if(b<1024*GB)return (b/GB).toFixed(2)+' GB';return (b/GB/1024).toFixed(2)+' TB'}
function showLogin(){clearInterval(timer);$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
async function doLogin(e){
  e.preventDefault();$('#le').textContent='';
  try{await api('POST','/api/login',{username:$('#lu').value,password:$('#lp').value});$('#lp').value='';start()}
  catch(x){$('#le').textContent=x.message}
  return false;
}
async function logout(){await api('POST','/api/logout').catch(()=>{});showLogin()}
async function start(){
  try{await refresh()}catch(e){return}
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  clearInterval(timer);timer=setInterval(()=>refresh().catch(()=>{}),10000);
}
async function refresh(){S=await api('GET','/api/state');render()}
function render(){
  if(!S)return;
  document.title=S.settings.title;$('#ttl').textContent=S.settings.title;
  const us=S.users,act=us.filter(u=>u.status==='active').length,tot=us.reduce((a,u)=>a+u.used,0);
  const mem=S.sys.memUsed/S.sys.memTotal*100,ld=Math.min(100,S.sys.load/S.sys.cpus*100);
  const d=Math.floor(S.sys.uptime/86400),h=Math.floor(S.sys.uptime%86400/3600);
  $('#stats').innerHTML=`
   <div class="glass st"><div class="l">Xray</div><div class="v"><span class="dot ${S.sys.xray?'on':''}"></span>${S.sys.xray?'Работает':'Остановлен'}</div><div class="h">Порт ${S.settings.port} · аптайм ${d}д ${h}ч</div></div>
   <div class="glass st"><div class="l">Пользователи</div><div class="v">${act} <small style="font-size:15px;color:var(--mut)">/ ${us.length}</small></div><div class="h">активных / всего</div></div>
   <div class="glass st"><div class="l">Трафик</div><div class="v">${fmt(tot)}</div><div class="h">всего использовано</div></div>
   <div class="glass st"><div class="l">CPU · RAM</div><div class="v">${ld.toFixed(0)}% · ${mem.toFixed(0)}%</div><div class="bar"><i style="width:${ld}%"></i></div><div class="bar"><i style="width:${mem}%"></i></div></div>`;
  const q=$('#q').value.toLowerCase();
  const list=us.filter(u=>(u.name+u.note).toLowerCase().includes(q));
  $('#grid').innerHTML=list.length?list.map((u,i)=>{
    const pct=u.limit?Math.min(100,u.used/u.limit*100):0;
    const exp=u.expire?new Date(u.expire).toLocaleDateString('ru-RU'):'∞';
    const left=u.expire?Math.ceil((u.expire-Date.now())/864e5):null;
    return `<div class="glass u" style="animation-delay:${i*.04}s">
     <div class="top"><div class="av">${esc(u.name[0]||'?').toUpperCase()}</div><div style="min-width:0"><div class="nm">${esc(u.name)}</div><div class="nt">${esc(u.note||'без заметки')}</div></div><span class="badge ${u.status}">${{active:'активен',disabled:'выключен',expired:'истёк',limited:'лимит'}[u.status]}</span></div>
     <div class="meta"><span>Трафик</span><b>${fmt(u.used)} / ${u.limit?fmt(u.limit):'∞'}</b></div>
     <div class="bar"><i style="width:${u.limit?pct:100}%;${u.limit?'':'opacity:.25'}"></i></div>
     <div class="meta"><span>До</span><b>${exp}${left!==null&&left>=0?` · ${left} дн.`:''}</b></div>
     <div class="act"><button class="btn s" onclick="showSub('${u.id}')">🔗 Подписка</button><button class="btn g s" onclick="openUser('${u.id}')">✎</button><button class="btn g s" onclick="toggle('${u.id}',${!u.enabled})">${u.enabled?'⏸':'▶'}</button><button class="btn d s" onclick="del('${u.id}')">🗑</button></div>
    </div>`}).join(''):`<div class="glass empty" style="grid-column:1/-1">Пока нет пользователей. Нажмите «Новый пользователь».</div>`;
}
function modal(html){$('#modal').innerHTML=`<div class="ov" onmousedown="if(event.target===this)closeM()"><div class="glass md">${html}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function openUser(id){
  const u=id?S.users.find(x=>x.id===id):null;
  modal(`<h3>${u?'Редактировать':'Новый пользователь'}</h3>
   <label>Имя</label><input id="mn" value="${u?esc(u.name):''}" placeholder="Например: Иван">
   <div class="row"><div><label>Лимит трафика, ГБ (0 = ∞)</label><input id="ml" type="number" min="0" step="any" value="${u?+(u.limit/GB).toFixed(2):0}"></div>
   <div><label>${u?'Продлить на, дней (с сегодня)':'Срок, дней'} (0 = ∞)</label><input id="md" type="number" min="0" value="${u?'':30}" placeholder="${u?'не менять':''}"></div></div>
   <label>Заметка</label><input id="mo" value="${u?esc(u.note):''}">
   ${u?`<div class="mf" style="margin-top:12px"><button class="btn g s" onclick="resetT('${u.id}')">↺ Сбросить трафик</button></div>`:''}
   <div class="mf"><button class="btn g" onclick="closeM()">Отмена</button><button class="btn" onclick="saveUser('${id||''}')">Сохранить</button></div>`);
  setTimeout(()=>$('#mn').focus(),50);
}
async function saveUser(id){
  const b={name:$('#mn').value,limitGb:$('#ml').value,note:$('#mo').value};
  const d=$('#md').value;if(d!=='')b.days=d;
  try{id?await api('PATCH','/api/users/'+id,b):await api('POST','/api/users',b);closeM();await refresh();toast('Сохранено ✓')}catch(e){toast(e.message)}
}
async function resetT(id){await api('PATCH','/api/users/'+id,{resetTraffic:true});closeM();await refresh();toast('Трафик сброшен')}
async function toggle(id,v){await api('PATCH','/api/users/'+id,{enabled:v});await refresh()}
async function del(id){if(!confirm('Удалить пользователя?'))return;await api('DELETE','/api/users/'+id);await refresh();toast('Удалён')}
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Скопировано ✓'),()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Скопировано ✓')})}
let qrLoaded=null;
function loadQR(){return qrLoaded||(qrLoaded=new Promise(r=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=r;s.onerror=r;document.head.appendChild(s)}))}
async function showSub(id){
  const u=S.users.find(x=>x.id===id),url=S.origin+'/sub/'+u.token;
  modal(`<h3>Подписка: ${esc(u.name)}</h3><p style="color:var(--mut);font-size:13px">Отсканируйте QR или скопируйте ссылку в приложение (v2RayTun, Happ, Hiddify, V2Box…)</p>
   <div class="qr"><div id="qrb"></div></div>
   <div class="code" onclick="copy('${url}')" title="Копировать">${esc(url)}</div>
   <div class="mf"><button class="btn g" onclick="copy('${url}')">Ссылка</button><button class="btn g" onclick="copyKey('${u.id}')">VLESS-ключ</button></div>
   <div class="mf"><button class="btn" onclick="closeM()">Закрыть</button></div>`);
  await loadQR();
  if(window.QRCode)new QRCode($('#qrb'),{text:url,width:200,height:200,colorDark:'#0a0a1a',colorLight:'#ffffff'});
}
async function copyKey(id){const r=await api('GET','/api/users/'+id+'/link');copy(r.link)}
function openSettings(){
  const s=S.settings;
  modal(`<h3>Настройки</h3>
   <label>Название</label><input id="st1" value="${esc(s.title)}">
   <label>IP или домен сервера (для ссылок)</label><input id="st2" value="${esc(s.host)}">
   <div class="row"><div><label>Порт VPN</label><input id="st3" type="number" value="${s.port}"></div><div><label>SNI (маскировка)</label><input id="st4" value="${esc(s.sni)}"></div></div>
   <label>Публичный URL панели для подписок (необязательно)</label><input id="st5" value="${esc(s.subBase)}" placeholder="https://panel.example.com">
   <div class="mf"><button class="btn g" onclick="closeM()">Отмена</button><button class="btn" onclick="saveSettings()">Сохранить</button></div>`);
}
async function saveSettings(){
  try{await api('PUT','/api/settings',{title:$('#st1').value,host:$('#st2').value,port:$('#st3').value,sni:$('#st4').value,subBase:$('#st5').value});closeM();await refresh();toast('Настройки сохранены, Xray перезапущен')}catch(e){toast(e.message)}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
api('GET','/api/state').then(()=>start()).catch(()=>showLogin());
</script>
</body>
</html>
